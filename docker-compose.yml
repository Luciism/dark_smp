name: dark-smp

services:
    dark_smp:
        image: josxha/minecraft-purpur:1.21.11
        container_name: dark_smp 
        restart: unless-stopped
        ports:
            - 0.0.0.0:25565:25565
            - 127.0.0.1:8081:8080
        volumes:
            - ./server:/data:rw
        environment:
            - TZ=Europe/London
            - RAM=6G

    rcon:
        image: itzg/rcon-cli:latest
        profiles: ["tools"]        # not started with `docker compose up`
        stdin_open: true
        tty: true
        environment:
            RCON_HOST: dark_smp     # service name of the server above
            RCON_PORT: "25575"
            RCON_PASSWORD: ${RCON_PASSWORD}

    backup:
        image: itzg/mc-backup
        restart: unless-stopped
        profiles: ["tools"]
        environment:
            RCON_HOST: dark_smp 
            RCON_PORT: "25575"
            RCON_PASSWORD: ${RCON_PASSWORD}
            BACKUP_INTERVAL: "0"
            PRUNE_BACKUPS_DAYS: "1"
            TAR_COMPRESS_METHOD: gzip
        volumes:
            - ./server:/data:ro
            - ./backups:/backups

    restarter:
        build: ./restarter
        restart: unless-stopped
        environment:
            RCON_HOST: dark_smp 
            RCON_PORT: "25575"
            RCON_PASSWORD: ${RCON_PASSWORD}
            RESTART_TIME: "04:00"
            TZ: Australia/Sydney


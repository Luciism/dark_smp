# Valid keys. Anything not listed maps to 0.
map $http_x_api_key $api_key_ok {
    default                          0;
    "REPLACE_WITH_LONG_RANDOM_KEY"   1;
}

# Per-IP rate limit shared across requests to this vhost.
limit_req_zone $binary_remote_addr zone=mc_status:10m rate=2r/s;

server {
    listen 80;
    server_name mcstatus.lucism.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcstatus.lucism.dev;

    ssl_certificate     /etc/letsencrypt/live/status.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    limit_req_status 429;

    # Reject before any location is considered. `if` containing only
    # `return` is the safe use of it.
    if ($api_key_ok = 0) {
        return 401;
    }

    # Allowlist: only these two endpoints, GET/HEAD only.
    location ~ ^/metrics/(current|entities)$ {
        limit_except GET {
            deny all;
        }

        limit_req zone=mc_status burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;   # plugin's configured port
        proxy_set_header Host $host;
        proxy_set_header X-Api-Key "";      # don't forward the key upstream
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # Default deny for everything else, including /metrics/players
    # and /metrics/history.
    location / {
        return 404;
    }
}

